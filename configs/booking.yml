app:
  name: ${APP_NAME}
  log_level: ${APP_LOG_LEVEL}
  env: ${APP_ENV}

server:
  name: booking-server
  host: 0.0.0.0
  port: 7020
  machine_id: 2

auth:
  jwt_secret: ${JWT_SECRET}
  jwt_issuer: ${JWT_ISSUER}
  jwt_audience: ${JWT_AUDIENCE}
  gateway_secret: ${GATEWAY_SECRET}

postgres:
  host: ${POSTGRES_HOST}
  port: ${POSTGRES_PORT}
  user: ${POSTGRES_USER}
  db: ${POSTGRES_DB}
  password: ${POSTGRES_PASSWORD}
  max_open_conns: 25
  max_idle_conns: 25
  conn_max_lifetime_min: 5

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  password: ${REDIS_PASSWORD}
  bloom_enabled: true
  cell_enabled: true
  db: ${REDIS_DB}
  pool_size: 256
  min_idle_conns: 64
  pool_timeout_ms: 750
  read_timeout_ms: 1000
  write_timeout_ms: 1000
  dial_timeout_ms: 2000
  bloom_filters:
    - key: ticketsphere:bloom:user:id
      capacity: 1000000
      fp_rate: 0.01
    - key: ticketsphere:bloom:user:email
      capacity: 1000000
      fp_rate: 0.01
    - key: ticketsphere:bloom:event:id
      capacity: 10000000
      fp_rate: 0.01
    - key: ticketsphere:bloom:seat:id
      capacity: 10000000000
      fp_rate: 0.05

rmq:
  host: ${RABBITMQ_HOST}
  port: ${RABBITMQ_PORT}
  user: ${RABBITMQ_USER}
  password: ${RABBITMQ_PASSWORD}
  consumers:
    postgres:
      workers: 2
      prefetch: 250
      batch_size: 250
      flush_interval_ms: 100

otel:
  service_name: booking-service
  otel_endpoint: ${OTEL_ENDPOINT}
  sample_rate: 0.8
  service_version: v1.1.0
  service_environment: ${APP_ENV}

prometheus:
  user: ${PROMETHEUS_USER}
  password: ${PROMETHEUS_PASSWORD}
  port: ${PROMETHEUS_PORT}

loki:
  url: http://${LOKI_HOST}:${LOKI_PORT}

rate_limit:
  per_minute: ${RATE_LIMIT_PER_MINUTE}
