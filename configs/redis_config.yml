host: ${REDIS_HOST}
port: 6379
password: ${REDIS_PASSWORD}
bloom_enabled: true
cell_enabled: true
db: ${REDIS_DB}
pool_size: 50
min_idle_conns: 10

bloom_filters:
  - key: ticketspehere:bloom:user:id
    capacity: 1000000
    fp_rate: 0.01

  - key: ticketspehere:bloom:user:email
    capacity: 1000000
    fp_rate: 0.01

  - key: ticketspehere:bloom:venue:id
    capacity: 1000000
    fp_rate: 0.01

  - key: ticketspehere:bloom:event:id
    capacity: 1000000
    fp_rate: 0.01
