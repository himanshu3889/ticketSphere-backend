app:
  name: ${APP_NAME}
  log_level: ${APP_LOG_LEVEL}
  env: ${APP_ENV}

postgres:
  host: ${POSTGRES_HOST}
  port: ${POSTGRES_PORT}
  user: ${POSTGRES_USER}
  db: ${POSTGRES_DB}
  password: ${POSTGRES_PASSWORD}
  max_open_conns: 25
  max_idle_conns: 25
  conn_max_lifetime_min: 5

mongodb:
  host: ${MONGODB_HOST}
  port: ${MONGODB_PORT}
  database: ${MONGODB_DATABASE}
  username: ${MONGODB_USERNAME}
  password: ${MONGODB_PASSWORD}
  min_pool_size: 2
  max_pool_size: 10

kafka:
  host: ${KAFKA_HOST}
  port: ${KAFKA_PORT}
  brokers:
    - ${KAFKA_HOST}:${KAFKA_PORT}

debezium:
  user: ${DEBEZIUM_USER}
  password: ${DEBEZIUM_PASSWORD}

elasticsearch:
  host: ${ELASTICSEARCH_HOST}
  port: ${ELASTICSEARCH_PORT}
  username: ${ELASTICSEARCH_USERNAME}
  password: ${ELASTICSEARCH_PASSWORD}

prometheus:
  user: ${PROMETHEUS_USER}
  password: ${PROMETHEUS_PASSWORD}
  port: ${PROMETHEUS_PORT}

grafana:
  port: ${GRAFANA_PORT}

loki:
  url: http://${LOKI_HOST}:${LOKI_PORT}

rate_limit:
  per_minute: ${RATE_LIMIT_PER_MINUTE}

