version: 2
gateway:
  entryPoints:
    web:
      address: ":8080"

  # Will use the tls certificate in future 
  # tls:
  #   certificates:
  #     - certFile: "/etc/goma/certs/gateway-client.pem"
  #       keyFile: "/etc/goma/certs/gateway-client-key.pem"

  log:
    level: info
    format: json

  # existing redis stack container
  redis:
    addr: "redis:${REDIS_PORT}"
    password: ${REDIS_PASSWORD}
    db: ${REDIS_DB}

  monitoring:
    enableMetrics: true
    metricsPath: /metrics

  routes:
    # --- Protected Services ---
    - name: inventory-api
      path: /api/inventory
      rewrite: /
      target: ${INVENTORY_API_TARGET}
      healthCheck:
        path: /health-check
        interval: 30s
        timeout: 10s
      middlewares: ["jwt-auth", "rate-limit-user", "inject-secret"]

    - name: booking-api
      path: /api/booking
      rewrite: /
      target: ${BOOKING_API_TARGET}
      healthCheck:
        path: /health-check
        interval: 30s
        timeout: 10s
      middlewares: ["jwt-auth", "rate-limit-user", "inject-secret"]

    - name: auth-api
      path: /api/auth
      rewrite: /auth
      target: ${BOOKING_API_TARGET}
      healthCheck:
        path: /health-check
        interval: 30s
        timeout: 10s
      middlewares: ["jwt-auth", "rate-limit-api", "inject-secret"]

    - name: payment-api
      path: /api/payment
      rewrite: /
      target: ${PAYMENT_API_TARGET}
      healthCheck:
        path: /health-check
        interval: 30s
        timeout: 10s
      middlewares: ["jwt-auth", "rate-limit-api", "inject-secret"]

    # --- Public Services ---
    - name: inventory-api-public
      path: /api/public/inventory
      rewrite: /public
      target: ${INVENTORY_API_TARGET}
      healthCheck:
        path: /health-check
        interval: 30s
        timeout: 10s
      middlewares: ["rate-limit-api", "inject-secret"]

    - name: auth-api-public
      path: /api/public/auth
      rewrite: /public/auth
      target: ${BOOKING_API_TARGET}
      healthCheck:
        path: /health-check
        interval: 30s
        timeout: 10s
      middlewares: ["rate-limit-api", "inject-secret"]

    # --- Webhooks ---
    - name: payment-webhook
      path: /webhook/payment-gateway
      target: ${PAYMENT_API_TARGET}
      healthCheck:
        path: /health-check
        interval: 30s
        timeout: 10s
      middlewares: ["inject-secret"]

middlewares:
  - name: jwt-auth
    type: jwtAuth
    paths: ["/*"]
    rule:
      secret: ${JWT_SECRET}
      algo: "HS256"
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}
      forwardHeaders:
        X-User-ID: user_id
        X-User-Email: email

  - name: rate-limit-api
    type: rateLimit
    paths: ["/*"]
    rule:
      unit: minute
      requestsPerUnit: 60
      burst: 20
      banAfter: 5
      banDuration: 2m
      store: redis
      keyStrategy:
        source: ip

  - name: rate-limit-user
    type: rateLimit
    paths: ["/*"]
    rule:
      unit: minute
      requestsPerUnit: 60
      burst: 20
      banAfter: 5
      banDuration: 30s
      store: redis
      keyStrategy:
        source: header
        name: X-User-ID

  - name: inject-secret
    type: requestHeaders
    paths: ["/*"]
    rule:
      setHeaders:
        X-Gateway-Secret: ${GATEWAY_SECRET}

  # - name: cors
  #   type: cors
  #   rule:
  #     origins: ["*"]
  #     methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
  #     headers: ["Authorization", "Content-Type", "X-Request-ID"]
  #     credentials: true
