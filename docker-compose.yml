name: ticketsphere

services:
  postgres:
    image: postgres:15-alpine
    container_name: ticketsphere-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    networks: [ticketsphere-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    # /dev/shm size
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB disabled (not used by any service right now)
  # mongodb:
  #   image: bitnami/mongodb:latest
  #   container_name: ticketsphere-mongodb
  #   environment:
  #     - MONGODB_ROOT_PASSWORD=${MONGODB_ROOT_PASSWORD}
  #     - MONGODB_DATABASE=${MONGODB_DATABASE}
  #     - MONGODB_USERNAME=${MONGODB_USERNAME}
  #     - MONGODB_PASSWORD=${MONGODB_PASSWORD}
  #   volumes:
  #     - mongodb_data:/bitnami/mongodb
  #   ports: ["27017:27017"]
  #   networks: [ticketsphere-net]
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "2.0"
  #         memory: 2G
  #   healthcheck:
  #     test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 20s


  redis:
    image: redis/redis-stack:latest
    container_name: ticketsphere-redis
    environment:
      REDIS_ARGS: >
        --requirepass ${REDIS_PASSWORD}
        --save 900 1
        --save 300 10
        --save 60 10000
        --maxmemory ${REDIS_MAXMEMORY:-512mb}
        --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports: ["6379:6379"]
    networks: [ticketsphere-net]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 4G  # 2M seats
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  # mongodb_data:   # disabled with the mongodb service above
  redis_data:

networks:
  ticketsphere-net:
    driver: bridge
