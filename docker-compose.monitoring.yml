name: ticketsphere

services:
  prometheus-config:
    image: alpine:3.19
    container_name: ticketsphere-prometheus-config
    env_file: .env
    volumes:
      - ./monitoring:/src:ro
      - prometheus_data:/etc/prometheus
    networks:
      - ticketsphere-net
    command: >
      sh -c "
        apk add --no-cache gettext &&
        envsubst < /src/prometheus.yml > /etc/prometheus/prometheus.yml
      "
    environment:
      - PROMETHEUS_PORT=${PROMETHEUS_PORT}
      - PROMETHEUS_USER=${PROMETHEUS_USER}
      - PROMETHEUS_PASSWORD=${PROMETHEUS_PASSWORD}

  prometheus:
    image: prom/prometheus:latest
    container_name: ticketsphere-prometheus
    user: "0:0"  # single root-owned named volume is mounted at both /etc/prometheus and /prometheus; image default (nobody) can't write the TSDB
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver" # lets k6 stream test metrics into Grafana
    volumes:
      - prometheus_data:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports: ["${PROMETHEUS_PORT}:9090"]
    networks: [ticketsphere-net]
    profiles: [monitoring]
    depends_on:
      prometheus-config:
        condition: service_completed_successfully
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ticketsphere-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT}:3000"]
    networks: [ticketsphere-net]
    profiles: [monitoring]
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: ticketsphere-loki
    ports: ["3100:3100"]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml
      - loki_data:/loki
    networks: [ticketsphere-net]
    profiles: [monitoring]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: ticketsphere-otel-collector
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otel/config.yml:ro
    ports:
      - "4317:4317" # gRPC OTLP receiver
      - "4318:4318" # HTTP OTLP receiver
      - "8889:8889" # Prometheus metrics for collector itself
    networks: [ticketsphere-net]
    profiles: [monitoring]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: ticketsphere-tempo
    user: "0:0"
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200" # Tempo HTTP API (Grafana queries this)
    networks: [ticketsphere-net]
    profiles: [monitoring]
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:

networks:
  ticketsphere-net:
    driver: bridge
