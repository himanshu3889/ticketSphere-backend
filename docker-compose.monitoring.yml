name: ticketsphere

services:
  prometheus-config:
    image: alpine:3.19
    container_name: ticketsphere-prometheus-config
    env_file: .env
    volumes:
      - ./monitoring:/src:ro
      - prometheus_data:/etc/prometheus
    command: >
      sh -c "
        apk add --no-cache gettext &&
        envsubst < /src/prometheus.yml > /etc/prometheus/prometheus.yml
      "
    environment:
      - PROMETHEUS_PORT=${PROMETHEUS_PORT}
      - PROMETHEUS_USER=${PROMETHEUS_USER}
      - PROMETHEUS_PASSWORD=${PROMETHEUS_PASSWORD}

  prometheus:
    image: prom/prometheus:latest
    container_name: ticketsphere-prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - prometheus_data:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports: ["${PROMETHEUS_PORT}:9090"]
    networks: [ticketsphere-net]
    profiles: [monitoring]
    depends_on:
      prometheus-config:
        condition: service_completed_successfully
    restart: unless-stopped


  grafana:
    image: grafana/grafana:latest
    container_name: ticketsphere-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes: [grafana_data:/var/lib/grafana]
    ports: ["${GRAFANA_PORT}:3000"]
    networks: [ticketsphere-net]
    profiles: [monitoring]
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: ticketsphere-loki
    ports: ["3100:3100"]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml 
      - loki_data:/loki
    networks: [ticketsphere-net]
    profiles: [monitoring]

