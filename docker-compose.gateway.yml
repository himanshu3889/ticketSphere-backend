name: ticketsphere

services:
  # goma gateway - public entry point

  # Renders goma.yml with env vars substituted
  gateway-config:
    image: alpine:3.19
    container_name: ticketsphere-gateway-config
    env_file: .env
    volumes:
      - ./gateway:/src:ro
      - gateway_data:/config
    networks:
      - ticketsphere-net
    command: >
      sh -c "
        apk add --no-cache gettext &&
        envsubst < /src/$${GOMA_TEMPLATE:-goma.yml} > /config/goma.yml
      "
    environment:
      - GOMA_TEMPLATE=goma.yml
      - INVENTORY_API_TARGET=${INVENTORY_API_TARGET}
      - BOOKING_API_TARGET=${BOOKING_API_TARGET}
      - PAYMENT_API_TARGET=${PAYMENT_API_TARGET}
      - GATEWAY_SECRET=${GATEWAY_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
      - REDIS_PORT=${REDIS_PORT}

  gateway:
    image: jkaninda/goma-gateway:0.15.1  # pinned: 1.0.0 (latest) removed `forwardHeaders` etc; config schema here is pre-1.0
    container_name: ticketsphere-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: --config /config/goma.yml
    ports:
      - "${GATEWAY_PORT}:8080"
    volumes:
      - gateway_data:/config:ro
    networks:
      - ticketsphere-net
    depends_on:
      gateway-config:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
    restart: unless-stopped

volumes:
  gateway_data:

networks:
  ticketsphere-net:
    driver: bridge
