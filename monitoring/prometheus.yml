# Global settings apply to all scrape jobs
global:
  # How often Prometheus checks for new metrics
  scrape_interval: 15s

# List of things Prometheus should monitor
scrape_configs:
  # Monitor Prometheus itself (so it can track its own health)
  - job_name: 'prometheus'
    # Static list of targets to scrape
    static_configs:
      # Target: the prometheus container at port 9090
      - targets: ['prometheus:9090']

  # Monitor your API application
  - job_name: 'ticketsphere-gateway'
    static_configs:
      # Target: your app at 7000 or app container at port 7000
      # This hits the /metrics endpoint automatically
      - targets: ['host.docker.internal:7777'] 
    metrics_path: /metrics
    scrape_interval: 15s


  - job_name: 'ticketsphere-inventory'
    static_configs:
      - targets: ['host.docker.internal:7010']
    metrics_path: /metrics
    scrape_interval: 15s
    basic_auth:
      username: ${PROMETHEUS_USER}
      password: ${PROMETHEUS_PASSWORD}
    
  - job_name: 'ticketsphere-booking'
    static_configs:
      - targets: ['host.docker.internal:7020']
    metrics_path: /metrics
    scrape_interval: 15s
    basic_auth:
      username: ${PROMETHEUS_USER}
      password: ${PROMETHEUS_PASSWORD}


