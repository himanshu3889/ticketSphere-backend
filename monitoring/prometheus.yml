global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          instance: "prometheus"

  - job_name: "ticketsphere-gateway"
    static_configs:
      # Target: your app at 7000 or app container at port 7000
      # This hits the /metrics endpoint automatically
      - targets: ['host.docker.internal:7777'] 
        labels:
          instance: "ticketsphere-gateway"
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: "ticketsphere-inventory"
    static_configs:
      - targets: ["host.docker.internal:7010"]
        labels:
          instance: "ticketsphere-inventory"
    metrics_path: /metrics
    scrape_interval: 15s
    basic_auth:
      username: ${PROMETHEUS_USER}
      password: ${PROMETHEUS_PASSWORD}

  - job_name: "ticketsphere-booking"
    static_configs:
      - targets: ["host.docker.internal:7020"]
        labels:
          instance: "ticketsphere-booking"
    metrics_path: /metrics
    scrape_interval: 15s
    basic_auth:
      username: ${PROMETHEUS_USER}
      password: ${PROMETHEUS_PASSWORD}

  - job_name: "ticketsphere-redis"
    static_configs:
      - targets: ["ticketsphere-redis-exporter:9121"]
        labels:
          instance: "ticketsphere-redis"

  - job_name: "ticketsphere-rabbitmq"
    static_configs:
      - targets: ["ticketsphere-rabbitmq-1:15692"]
        labels:
          instance: "ticketsphere-rabbitmq"

  - job_name: "ticketsphere-postgres"
    static_configs:
      - targets: ["ticketsphere-postgres-exporter:9187"]
        labels:
          instance: "ticketsphere-postgres"
